<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Samizdat</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<style>
:root {
  --paper: #f1ecdf;
  --paper-2: #e8e1cf;
  --paper-edge: #d9cfb6;
  --ink: #1b2240;
  --ink-soft: #3c4566;
  --ink-faint: #6f7590;
  --carbon: #2f3a8a;
  --pencil: #c2361f;
  --pencil-soft: rgba(194, 54, 31, .12);
  --rule: rgba(27, 34, 64, .18);
  --line: rgba(27, 34, 64, .055);
  --good: #2f6b3a;
  --serif: 'PT Serif', Georgia, serif;
  --type: 'Courier Prime', 'Courier New', monospace;
  --stencil: 'Big Shoulders Stencil', 'PT Serif', serif;
  --measure: 68ch;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14172a;
    --paper-2: #1b1f37;
    --paper-edge: #2a2f4d;
    --ink: #e7e2d3;
    --ink-soft: #c3bfb2;
    --ink-faint: #8e8c99;
    --carbon: #9aa6ff;
    --pencil: #ff7a5c;
    --pencil-soft: rgba(255, 122, 92, .14);
    --rule: rgba(231, 226, 211, .16);
    --line: rgba(231, 226, 211, .04);
    --good: #8fd19b;
  }
}
:root[data-theme="dark"] {
  --paper: #14172a; --paper-2: #1b1f37; --paper-edge: #2a2f4d;
  --ink: #e7e2d3; --ink-soft: #c3bfb2; --ink-faint: #8e8c99;
  --carbon: #9aa6ff; --pencil: #ff7a5c; --pencil-soft: rgba(255,122,92,.14);
  --rule: rgba(231,226,211,.16); --line: rgba(231,226,211,.04); --good: #8fd19b;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.35), transparent 55%),
    repeating-linear-gradient(0deg, transparent 0 31px, var(--line) 31px 32px);
  background-size: auto, 100% 32px;
  color: var(--ink);
  font: 400 18px/1.62 var(--serif);
  font-kerning: normal;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body { background-image: radial-gradient(ellipse at 20% 0%, rgba(154,166,255,.08), transparent 55%), repeating-linear-gradient(0deg, transparent 0 31px, var(--line) 31px 32px); }
}
a { color: var(--carbon); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--pencil); }
code, kbd, pre, .type { font-family: var(--type); }
code { font-size: .92em; background: var(--paper-2); padding: .05em .3em; border-radius: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.col { max-width: var(--measure); }

/* Masthead */
.mast {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: 18px 0; border-bottom: 2px solid var(--ink);
  font-family: var(--type); font-size: 14px; letter-spacing: .04em; text-transform: uppercase;
}
.mast nav { display: flex; gap: 18px; flex-wrap: wrap; justify-content: flex-end; }
.mast a { color: var(--ink); text-decoration: none; }
.mast a:hover { color: var(--pencil); }
.mast .no { color: var(--ink-faint); }

/* Hero */
.hero { padding: 72px 0 56px; position: relative; }
.hero .kicker { font-family: var(--type); color: var(--ink-faint); font-size: 15px; letter-spacing: .06em; }
.hero h1 {
  font-family: var(--stencil); font-weight: 900; text-transform: uppercase;
  font-size: clamp(64px, 14vw, 168px); line-height: .86; letter-spacing: .01em;
  margin: 10px 0 0; color: var(--ink);
}
.hero h1 .ru {
  display: block; font-family: var(--serif); font-weight: 700; text-transform: none; font-style: italic;
  font-size: .32em; letter-spacing: 0; line-height: 1.2; color: var(--carbon); margin-top: .3em;
}
.hero .lede { font-size: clamp(20px, 2.6vw, 26px); line-height: 1.45; max-width: 38ch; margin: 28px 0 0; }
.hero .lede em { font-style: normal; background: linear-gradient(transparent 62%, var(--pencil-soft) 62%); }
.stamp {
  position: absolute; right: 0; top: 84px; transform: rotate(-9deg);
  border: 3px double var(--pencil); color: var(--pencil); padding: 10px 16px;
  font-family: var(--type); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.35;
  text-align: center; opacity: .85; mix-blend-mode: multiply;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: normal; } }
.cta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 34px; }
.btn {
  font-family: var(--type); font-weight: 700; font-size: 15px; letter-spacing: .03em;
  padding: 12px 18px; border: 2px solid var(--ink); color: var(--ink); text-decoration: none; background: var(--paper);
  box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { color: var(--paper); }

/* Typed sheet: the carbon-copy card */
.sheet {
  background: var(--paper-2); border: 1px solid var(--paper-edge);
  box-shadow: 0 1px 0 var(--paper-edge), 6px 8px 0 -2px var(--paper-edge);
  padding: 22px 24px; font-family: var(--type); font-size: 15px; line-height: 1.55; position: relative;
}
.sheet::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 3px, rgba(47,58,138,.025) 3px 4px);
}

section { padding: 64px 0; border-top: 1px solid var(--rule); }
section > .wrap > h2, .h2 {
  font-family: var(--stencil); font-weight: 900; text-transform: uppercase; letter-spacing: .015em;
  font-size: clamp(38px, 6vw, 64px); line-height: .95; margin: 0 0 22px;
}
.num { font-family: var(--type); color: var(--pencil); font-size: 15px; letter-spacing: .08em; display: block; margin-bottom: 8px; }
h3 { font-family: var(--serif); font-size: 23px; line-height: 1.25; margin: 34px 0 8px; }
p { margin: 0 0 1em; }

.note {
  font-family: var(--type); font-size: 14.5px; line-height: 1.5; color: var(--pencil);
  border-left: 3px solid var(--pencil); padding: 4px 0 4px 14px; margin: 18px 0;
}

/* Two observers */
.observers { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 30px; }
.observers .sheet h3 { font-family: var(--type); font-size: 15px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px; color: var(--carbon); }
.observers ol { margin: 0; padding-left: 1.3em; }
.observers li { margin-bottom: .45em; }

/* Bar chart */
.chart { margin: 30px 0 10px; display: grid; gap: 12px; }
.bar { display: grid; grid-template-columns: minmax(150px, 260px) 1fr; gap: 14px; align-items: center; }
.bar .label { font-family: var(--type); font-size: 14.5px; line-height: 1.3; }
.bar .track { display: block; position: relative; height: 30px; border-bottom: 1px solid var(--rule); }
.bar .fill {
  display: block; height: 100%; width: calc(var(--v) / 70 * 100%);
  background: repeating-linear-gradient(-45deg, var(--ink) 0 2px, transparent 2px 6px);
  border: 2px solid var(--ink); transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both;
}
.bar.us .fill { background: var(--carbon); border-color: var(--carbon); }
.bar.floor .fill { background: transparent; border-style: dashed; }
.bar .val { position: absolute; left: calc(var(--v) / 70 * 100% + 8px); top: 3px; font-family: var(--type); font-weight: 700; font-size: 15px; white-space: nowrap; }
.bar.us .val { color: var(--carbon); }
.chart-cap { font-family: var(--type); font-size: 13.5px; color: var(--ink-faint); margin-top: 8px; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* Findings list */
.findings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 40px; margin-top: 30px; }
.finding { border-top: 3px solid var(--ink); padding-top: 12px; }
.finding .big { font-family: var(--stencil); font-weight: 900; font-size: 46px; line-height: 1; display: block; }
.finding .big small { font-size: .45em; font-family: var(--type); font-weight: 700; }
.finding p { font-size: 16.5px; margin: 8px 0 0; }
.finding cite { font-style: normal; font-family: var(--type); font-size: 13px; color: var(--ink-faint); display: block; margin-top: 6px; }

/* Comparison table */
.table-scroll { overflow-x: auto; margin: 30px -16px 0; padding: 0 16px 8px; -webkit-overflow-scrolling: touch; }
table.cmp { border-collapse: collapse; table-layout: fixed; min-width: 1060px; width: 100%; font-size: 15px; line-height: 1.45; background: var(--paper); }
.cmp th, .cmp td { text-align: left; vertical-align: top; padding: 11px 12px; border-bottom: 1px solid var(--rule); }
.cmp thead th {
  font-family: var(--type); font-size: 13.5px; text-transform: uppercase; letter-spacing: .06em;
  border-bottom: 2px solid var(--ink); position: sticky; top: 0; background: var(--paper);
}
.cmp tbody th { font-family: var(--type); font-weight: 700; font-size: 13.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); }
.cmp col.rowh { width: 128px; }
.cmp col.szc { width: 21%; }
.cmp .sz { background: var(--pencil-soft); }
.cmp thead .sz { color: var(--pencil); background: var(--paper); box-shadow: inset 0 -3px 0 var(--pencil); }
.cmp td .src { display: block; font-family: var(--type); font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
.cmp td .src a { color: inherit; }
.tag { font-family: var(--type); font-size: 12px; font-weight: 700; letter-spacing: .05em; padding: 1px 6px; border: 1px solid currentColor; display: inline-block; margin-bottom: 4px; }
.tag.y { color: var(--good); }
.tag.n { color: var(--pencil); }
.tag.m { color: var(--ink-faint); }

/* How it works */
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px 36px; margin-top: 18px; }
.how h3 { margin-top: 10px; }
.how h3 .num { display: inline; margin: 0 8px 0 0; }
pre.sheet { overflow-x: auto; white-space: pre; margin: 16px 0; font-size: 13.5px; }

/* Limits */
.limits { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 14px; }
.limits li { padding-left: 34px; position: relative; }
.limits li::before { content: "✕"; position: absolute; left: 0; top: 0; font-family: var(--type); font-weight: 700; color: var(--pencil); }

/* FAQ */
.faq { margin-top: 10px; }
.faq .qa { border-top: 1px solid var(--rule); padding: 18px 0 4px; }
.faq .qa:first-child { border-top: 2px solid var(--ink); }
.faq h3 { margin: 0 0 8px; font-size: 21px; }
.faq .q, .faq .a { font-family: var(--type); font-weight: 700; color: var(--pencil); margin-right: .35em; }
.faq .a { color: var(--carbon); }

/* References */
.refs { font-size: 15.5px; padding-left: 1.4em; }
.refs li { margin-bottom: .7em; }

.more { padding: 40px 0 36px; }
.sisters { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px 32px; }
.sisters li { font-size: 16px; line-height: 1.4; }
.sisters a { font-family: var(--type); font-weight: 700; font-size: 15px; display: block; }
.sisters span { color: var(--ink-soft); }

footer { border-top: 2px solid var(--ink); padding: 28px 0 48px; font-family: var(--type); font-size: 14px; color: var(--ink-soft); }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* Page-load reveal */
.reveal { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 90ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.caret::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--pencil); margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .reveal, .bar .fill { animation: none; }
  .caret::after { animation: none; }
}

@media (max-width: 760px) {
  body { font-size: 17px; }
  .stamp { position: static; display: inline-block; margin-top: 24px; transform: rotate(-4deg); }
  .hero { padding-top: 44px; }
  .observers, .findings { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 1fr; gap: 4px; }
  .mast { flex-direction: column; align-items: flex-start; }
  .mast nav { justify-content: flex-start; gap: 12px; }
  section { padding: 48px 0; }
}

body { min-height: 100vh; }
.nf { padding: 96px 0 120px; }
.nf h1 { font-family: var(--stencil); font-weight: 900; text-transform: uppercase; font-size: clamp(64px, 14vw, 150px); line-height: .9; margin: 10px 0 18px; }
.nf p { max-width: 46ch; font-size: 20px; }
</style>
</head>

<div class="wrap">
  <header class="mast">
    <span><a href="/">Samizdat</a></span>
    <nav aria-label="Site"><a href="/">Home</a><a href="/#faq">FAQ</a><a href="https://lantern.io">Lantern</a></nav>

  </div>
</div>
</body>
</html>
